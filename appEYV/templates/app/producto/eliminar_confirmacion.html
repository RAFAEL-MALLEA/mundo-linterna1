{% extends 'app/base.html' %}

{% block title %}Mundo Linterna | Eliminar producto{% endblock %}

{% block contenido %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card">
        <div class="card-body">
          <h2>Eliminar producto</h2>
          <hr>
          <h5>¿Estás seguro de que quieres eliminar este producto?</h5>
          <p>Producto: <strong>{{ producto.nombre_prod }}</strong></p>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'listar-productos' %}" class="btn btn-secondary">Cancelar</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
